workflows:
  android-workflow:
    name: Android Release Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        # Create this group in Codemagic UI (Teams > Environment variables)
        # with encrypted variables:
        #   CM_KEYSTORE            - base64-encoded .jks/.keystore file
        #   CM_KEYSTORE_PASSWORD   - storePassword from android/key.properties
        #   CM_KEY_ALIAS           - keyAlias from android/key.properties
        #   CM_KEY_PASSWORD        - keyPassword from android/key.properties
        - keystore_credentials
      vars:
        PACKAGE_NAME: "com.mobile.remote_gate_control_mobile"
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: |
          flutter packages pub get

      - name: Set up local keystore for signing
        script: |
          echo $CM_KEYSTORE | base64 --decode > $CM_BUILD_DIR/android/app/keystore.jks
          cat > $CM_BUILD_DIR/android/key.properties <<EOF
          storePassword=$CM_KEYSTORE_PASSWORD
          keyPassword=$CM_KEY_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          storeFile=keystore.jks
          EOF

      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release

    artifacts:
      - build/**/outputs/**/*.aab
      - build/**/outputs/**/mapping.txt

    publishing:
      email:
        recipients:
          - eozturk78@gmail.com
        notify:
          success: true
          failure: true

  ios-testflight:
    name: iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # Codemagic UI > Personal Account > Integrations > App Store Connect >
      # "Manage keys" - must match the key name shown there exactly.
      app_store_connect: "Pultix"
    environment:
      # Pinned (not "stable") to match the Flutter version this app is
      # tested against, so Codemagic's SDK can't drift out from under us.
      flutter: 3.35.4
      xcode: latest
      cocoapods: default
      ios_signing:
        # With the App Store Connect integration above, Codemagic fetches/
        # generates the certificate and provisioning profile automatically -
        # no manual certificate upload needed.
        distribution_type: app_store
        bundle_identifier: com.mobile.remoteGateControlMobile
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: 'v*'
          include: true
    scripts:
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Get Flutter packages
        script: |
          flutter packages pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -maxdepth 2 -execdir pod install \;
      - name: Flutter build ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - eozturk78@gmail.com
        notify:
          success: true
          failure: true
      app_store_connect:
        auth: integration
        submit_to_testflight: true
